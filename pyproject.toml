[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promql-analyzer"
version = "0.2.1"
description = "Static analysis and explanation toolkit for PromQL queries"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Ranga Bashyam G", email = "rangabashyam22@gmail.com" },
]
keywords = [
    "promql",
    "prometheus",
    "static-analysis",
    "lint",
    "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "promql-parser>=0.5.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
promql-analyze = "promql_analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/ranga-godhandaraman/promql-parser-lib"
Repository = "https://github.com/ranga-godhandaraman/promql-parser-lib"
Issues = "https://github.com/ranga-godhandaraman/promql-parser-lib/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promql_analyzer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
